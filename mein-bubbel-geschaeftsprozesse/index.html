<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mein Bubbel schafft das – Probeklausur Geschäftsprozesse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d3a8f; --ink2:#2a4fb8; --red:#c62828; --green:#2e7d32; --pencil:#555;
  --paper:#fdfdf6; --grid:#c9dcef; --margin:#e57373; --marker:rgba(255,235,59,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:#6d7b8a radial-gradient(circle at 30% 20%,#8a97a5,#55606c);
  font-family:'Kalam',cursive; color:var(--ink); min-height:100vh;
  display:flex; flex-direction:column; align-items:center; padding:18px 10px 40px;
}
.topbar{width:100%;max-width:860px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px;color:#fff;font-family:'Caveat';font-size:22px}
.topbar .bar{flex:1;height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.topbar .bar i{display:block;height:100%;background:#ffd54f;width:0;transition:width .5s}
.page{
  position:relative; width:100%; max-width:860px; min-height:1120px;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:20px 20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 0 #fff inset;
  padding:34px 34px 90px 96px; border-radius:2px;
  animation:flip .45s ease;
}
.page:before{ /* Rand */
  content:""; position:absolute; top:0; bottom:0; left:72px; width:2px; background:var(--margin); opacity:.8;
}
.page .holes{position:absolute;left:22px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:120px 0}
.page .holes span{width:20px;height:20px;border-radius:50%;background:#55606c;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
@keyframes flip{from{opacity:0;transform:translateX(40px) rotate(.6deg)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;font-family:'Caveat';font-size:22px;color:var(--pencil);border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:18px}
h1,h2,h3{font-family:'Caveat';font-weight:700;margin:.2em 0 .3em;line-height:1.1}
h1{font-size:54px;color:var(--red);transform:rotate(-1.5deg)}
h2{font-size:40px;color:var(--ink)}
h2 u{text-decoration:underline wavy var(--red) 2px;text-underline-offset:6px}
h3{font-size:30px;color:var(--ink2);margin-top:22px}
p,li{font-size:19px;line-height:1.55}
ul{padding-left:22px}
.mark{background:linear-gradient(100deg,transparent 2%,var(--marker) 4%,var(--marker) 96%,transparent 98%);padding:0 3px}
.red{color:var(--red)}
.box{border:2.5px solid var(--red);border-radius:12px 18px 10px 16px;padding:10px 16px;margin:14px 0;transform:rotate(-.3deg);background:rgba(255,255,255,.35)}
.box b.t{font-family:'Caveat';font-size:26px;color:var(--red)}
.formula{font-size:21px;padding:6px 14px;border-left:4px solid var(--ink);margin:10px 0;background:rgba(29,58,143,.05)}
table.bs{border-collapse:collapse;margin:8px 0 12px;font-size:18px}
table.bs td{padding:1px 10px}
table.bs td.n{text-align:right;font-variant-numeric:tabular-nums}
table.bs td.an{color:var(--red);font-weight:700;padding-left:30px}
table.calc{border-collapse:collapse;font-size:18px;margin:6px 0 12px}
table.calc td{padding:1px 12px}
table.calc td.n{text-align:right}
table.calc tr.sum td{border-top:2px solid var(--ink);font-weight:700}
.task{margin:26px 0 34px}
.task h3{margin-bottom:4px}
.task .txt{font-size:19px}
.part{margin:14px 0 6px;padding-left:4px}
.part .lbl{font-size:19px;margin-bottom:4px}
.state{display:inline-block;margin-left:8px;font-family:'Caveat';font-size:28px;line-height:1}
.ok{color:var(--green)} .bad{color:var(--red)}
input.num{font-family:'Kalam';font-size:20px;color:var(--ink);background:transparent;border:none;border-bottom:2px dashed var(--ink);width:170px;padding:0 6px;outline:none}
input.num:focus{border-bottom-style:solid;background:rgba(255,255,255,.6)}
.unit{font-size:19px;margin-left:4px}
.book{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-start;margin-top:4px}
.book .side{min-width:300px}
.book .side .cap{font-family:'Caveat';font-size:22px;color:var(--pencil)}
.book .an{font-family:'Caveat';font-size:30px;color:var(--red);padding-top:22px}
.brow{display:flex;gap:6px;align-items:center;margin:3px 0}
select{font-family:'Kalam';font-size:16px;color:var(--ink);background:rgba(255,255,255,.55);border:1.5px solid #9fb3d9;border-radius:4px;padding:2px 4px;max-width:260px}
.brow input.num{width:120px;font-size:18px}
.mini{font-family:'Caveat';font-size:20px;background:none;border:none;color:var(--ink2);cursor:pointer;padding:0 4px}
.mini:hover{color:var(--red)}
.choice label{display:block;font-size:18px;cursor:pointer;padding:1px 0}
.choice input{accent-color:var(--ink);transform:scale(1.2);margin-right:8px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
button.pen{font-family:'Caveat';font-size:26px;color:#fff;background:var(--ink);border:none;border-radius:10px 14px 9px 13px;padding:4px 20px;cursor:pointer;box-shadow:2px 3px 0 rgba(0,0,0,.25)}
button.pen:hover{background:var(--ink2)}
button.pen.red{background:var(--red)}
button.pen:disabled{background:#9aa3b5;cursor:not-allowed;box-shadow:none}
.hints{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.hint{width:240px;min-height:74px;position:relative;font-size:16px;line-height:1.4;padding:10px 12px;background:#fffbe0;border:1px solid #e6d77a;color:#4a4a2a;box-shadow:2px 3px 6px rgba(0,0,0,.15);transform:rotate(-1deg)}
.hint:nth-child(2){transform:rotate(1.2deg)} .hint:nth-child(3){transform:rotate(-.4deg)}
.hint .cover{position:absolute;inset:0;background:#ffe066;display:flex;align-items:center;justify-content:center;font-family:'Caveat';font-size:24px;color:#6b5600;cursor:pointer;transition:transform .35s ease,opacity .35s}
.hint .cover.locked{background:#ece5bd;color:#a59a63;cursor:not-allowed}
.hint .cover.open{transform:translateY(-110%) rotate(-8deg);opacity:0;pointer-events:none}
.solution{margin-top:14px;padding:10px 16px;border:2px dashed var(--green);border-radius:10px;color:#1e5a22;font-size:18px;display:none}
.solution.show{display:block}
.fb{font-family:'Caveat';font-size:24px;margin-left:6px}
button.pen.skip{background:#9aa3b5}
.overlay{position:fixed;inset:0;background:rgba(30,40,60,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.savecard{max-width:560px;width:100%;background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;padding:24px 28px;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:rotate(-.5deg)}
.savecard .code{font-family:Consolas,'Courier New',monospace;font-size:28px;font-weight:700;letter-spacing:1px;color:var(--red);border:3px dashed var(--red);border-radius:10px;padding:8px 14px;text-align:center;margin:10px 0;word-break:break-all}
.tree{font-size:18px;margin:8px 0 12px;padding:8px 14px;border-left:3px solid var(--ink)}
.tree ul{list-style:none;margin:2px 0;padding-left:26px;border-left:2px dashed #9fb3d9}
.tree li{position:relative;margin:2px 0}
.tree li:before{content:'';position:absolute;left:-26px;top:14px;width:20px;border-top:2px dashed #9fb3d9}
.rfb{font-family:'Caveat';font-size:20px;margin-left:4px;white-space:nowrap}
.sumline{font-family:'Caveat';font-size:20px;color:var(--pencil);margin-top:4px}
.rowmsg{font-family:'Caveat';font-size:21px}
.nav{position:absolute;left:96px;right:34px;bottom:26px;display:flex;justify-content:space-between;align-items:center}
.nav .pg{font-family:'Caveat';font-size:22px;color:var(--pencil)}
.locked-msg{font-family:'Caveat';font-size:21px;color:var(--red)}
.toc li{font-size:20px;list-style:none;margin:4px 0;cursor:pointer}
.toc li.lock{color:#9aa3b5;cursor:default}
.toc li .ic{display:inline-block;width:30px}
.doodle{position:absolute;right:40px;top:110px;font-family:'Caveat';font-size:26px;color:var(--red);transform:rotate(8deg);text-align:center}
.stamp{display:inline-block;border:3px solid var(--green);color:var(--green);font-family:'Caveat';font-size:34px;padding:2px 16px;border-radius:8px;transform:rotate(-6deg)}
@media (max-width:640px){
  .page{padding:24px 14px 100px 46px;min-height:auto}
  .page:before{left:34px}
  .page .holes{display:none}
  .nav{left:46px;right:14px}
  h1{font-size:40px} h2{font-size:32px}
  .book .side{min-width:0;width:100%}
  .book .an{padding-top:0}
  .doodle{display:none}
}
</style>
</head>
<body>
<div class="topbar"><span id="tbl">Fortschritt</span><div class="bar"><i id="bar"></i></div><span id="tbr"></span><button class="pen" id="saveBtn" style="font-size:22px;padding:2px 14px;background:#ffd54f;color:#3a3000">💾 Speichern</button></div>
<div class="page" id="page"></div>

<script>
/* ---------- Konten (IKR) ---------- */
const KONTEN = {
  "0700":"Techn. Anlagen und Maschinen","0840":"Fuhrpark","0860":"Büromaschinen","0870":"Büromöbel/Geschäftsausst. (BGA)",
  "0900":"Geleistete Anzahlungen auf Sachanlagen",
  "2000":"Rohstoffe","2020":"Hilfsstoffe","2030":"Betriebsstoffe","2100":"Unfertige Erzeugnisse","2200":"Fertige Erzeugnisse",
  "2400":"Forderungen a. LL","2600":"Vorsteuer","2800":"Bank","2880":"Kasse",
  "3000":"Eigenkapital","4250":"Langfr. Bankverbindlichkeiten","4400":"Verbindlichkeiten a. LL","4800":"Umsatzsteuer",
  "5000":"Umsatzerlöse f. eigene Erzeugnisse","5001":"Erlösberichtigungen","5200":"Bestandsveränderungen",
  "5201":"Bestandsveränd. unfertige Erzeugnisse","5202":"Bestandsveränd. fertige Erzeugnisse","5300":"Aktivierte Eigenleistungen",
  "6000":"Aufwendungen für Rohstoffe","6001":"Bezugskosten Rohstoffe","6002":"Nachlässe Rohstoffe",
  "6020":"Aufwendungen für Hilfsstoffe","6030":"Aufwendungen für Betriebsstoffe",
  "6520":"Abschreibungen auf Sachanlagen","6750":"Kosten des Geldverkehrs","7510":"Zinsaufwendungen"
};
const eur = n => n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => Number.isInteger(n) ? n.toLocaleString('de-DE') : eur(n);
const K = k => `${k} ${KONTEN[k]}`;
function bs(soll, haben){ // Buchungssatz als Tabelle
  const rows = Math.max(soll.length, haben.length); let h='<table class="bs">';
  for(let i=0;i<rows;i++){
    const s=soll[i], b=haben[i];
    h+=`<tr><td>${s?K(s[0]):''}</td><td class="n">${s?eur(s[1]):''}</td><td class="an">${i==0?'an':''}</td><td>${b?K(b[0]):''}</td><td class="n">${b?eur(b[1]):''}</td></tr>`;
  }
  return h+'</table>';
}
function table3(rows){ return '<table class="calc">'+rows.map((r,i)=>`<tr>${r.map((c,j)=>`<td class="${j?'n':''}" style="${i==0?'font-weight:700':''}">${c}</td>`).join('')}</tr>`).join('')+'</table>'; }
function calc(rows){ // [label, wert, sum?]
  return '<table class="calc">'+rows.map(r=>`<tr class="${r[2]?'sum':''}"><td>${r[0]}</td><td class="n">${r[1]}</td></tr>`).join('')+'</table>';
}

/* ---------- Inhalte ---------- */
const TOPICS = [
/* 1 */ {
title:"Ziele der Leistungserstellung & Zielkonflikte",
info:`
<p>Die <span class="mark">Leistungserstellung</span> (Produktion) soll Erzeugnisse in der richtigen Menge, Qualität und Zeit zu möglichst geringen Kosten herstellen. Dafür verfolgt ein Betrieb mehrere Ziele gleichzeitig:</p>
<div class="box"><b class="t">ökonomische Ziele</b><br>niedrige Kosten · hohe Qualität · hohe Kapazitätsauslastung · kurze Durchlaufzeiten · Termintreue · niedrige Lagerbestände · Flexibilität<br>
<b class="t">ökologische Ziele</b><br>Ressourcen schonen · wenig Abfall & Emissionen · Recycling<br>
<b class="t">soziale Ziele</b><br>Arbeitssicherheit · ergonomische, abwechslungsreiche Arbeitsplätze · sichere Arbeitsplätze</div>
<h3>Zielbeziehungen</h3>
<ul>
<li><b>komplementär (Zielharmonie):</b> Ein Ziel fördert das andere.<br><i>Weniger Ausschuss → niedrigere Kosten.</i></li>
<li><b>konkurrierend (Zielkonflikt):</b> Ein Ziel behindert das andere.<br><i>Mehr Sicherheitsbestand (Lieferbereitschaft) → höhere Lagerkosten.</i></li>
<li><b>indifferent (neutral):</b> Die Ziele beeinflussen sich nicht.<br><i>Neue Firmenwagen-Lackierung ↔ Ausschussquote.</i></li>
</ul>
<div class="box"><b class="t">Klassiker: Dilemma der Ablaufplanung</b><br>
<b>Hohe Kapazitätsauslastung</b> (Maschinen sollen nie stillstehen → Aufträge warten in der Schlange) steht im Konflikt mit <b>kurzen Durchlaufzeiten</b> (Aufträge sollen nie warten → Maschinen stehen öfter still).</div>
<p class="red">Weitere typische Konflikte: niedrige Lagerbestände ↔ hohe Lieferbereitschaft · Kosten senken ↔ Umweltschutz · große Lose (wenig Rüstkosten) ↔ niedrige Lagerkosten.</p>
<p>Achtung: Zielbeziehungen hängen von der <b>Situation</b> ab. „Qualität ↔ Kosten" kann ein Konflikt sein (teurere Prüfungen) – oder eine Harmonie (weniger Ausschuss und Nacharbeit spart Geld). Begründe in der Klausur immer, <b>warum</b>.</p>`,
tasks:[
 {title:"Aufgabe 1.1",
  text:`Bestimme jeweils die Zielbeziehung.`,
  parts:[
   {type:'pick',label:'a) Kapazitätsauslastung erhöhen ↔ Durchlaufzeiten verkürzen',options:['komplementär','konkurrierend','indifferent'],ans:1},
   {type:'pick',label:'b) Ausschussquote senken ↔ Materialkosten senken',options:['komplementär','konkurrierend','indifferent'],ans:0},
   {type:'pick',label:'c) Lagerbestände senken ↔ Lieferbereitschaft erhöhen',options:['komplementär','konkurrierend','indifferent'],ans:1},
   {type:'pick',label:'d) Energieverbrauch der Maschinen senken ↔ CO₂-Ausstoß senken',options:['komplementär','konkurrierend','indifferent'],ans:0},
   {type:'pick',label:'e) Farbe der Arbeitskleidung ändern ↔ Rüstzeiten senken',options:['komplementär','konkurrierend','indifferent'],ans:2}
  ],
  hints:["Frag dich bei jedem Paar: Wenn ich Ziel 1 besser erreiche – wird Ziel 2 dann leichter, schwerer oder ist es egal?"],
  solution:`a) konkurrierend (Dilemma der Ablaufplanung) · b) komplementär (weniger Ausschuss = weniger verschwendetes Material) · c) konkurrierend · d) komplementär · e) indifferent`
 },
 {title:"Aufgabe 1.2",
  text:`Die Bubbel Metallbau GmbH will ihre Maschinen möglichst rund um die Uhr auslasten. Der Vertrieb beschwert sich, dass Kundenaufträge deshalb immer länger dauern.`,
  parts:[
   {type:'choice',label:'a) Wie nennt man diesen Zielkonflikt?',options:['Dilemma der Ablaufplanung','Leverage-Effekt','Make-or-Buy-Problem','Losgrößendilemma'],ans:[0]},
   {type:'choice',multi:true,label:'b) Welche Ziele zählen zu den ökologischen Zielen? (alle richtigen ankreuzen)',options:['Abfall vermeiden','Kapazitätsauslastung erhöhen','Energie aus erneuerbaren Quellen nutzen','Arbeitsunfälle vermeiden','Materialien recyceln'],ans:[0,2,4]},
   {type:'choice',label:'c) Welche Aussage zu Zielkonflikten stimmt?',options:['Zielkonflikte lassen sich immer vollständig auflösen.','Das Unternehmen muss die Ziele gewichten und einen Kompromiss finden.','Bei Zielkonflikten verfolgt man nur noch ökologische Ziele.'],ans:[1]}
  ],
  hints:["Volle Maschinen = Aufträge warten. Kurze Wartezeiten = Maschinen stehen öfter leer. Wie heißt dieser Klassiker?","Arbeitsunfälle vermeiden betrifft die Menschen im Betrieb – welche Zielgruppe ist das?"],
  solution:`a) <b>Dilemma der Ablaufplanung</b><br>b) Abfall vermeiden, erneuerbare Energie, Recycling (Arbeitsunfälle = soziales Ziel, Auslastung = ökonomisch)<br>c) Ziele müssen <b>gewichtet</b> werden → Kompromiss.`
 },
 {title:"Aufgabe 1.3",
  text:`Die Bubbel Metallbau GmbH will ihre Lieferzeit von <b>10 auf 5 Tage</b> senken. Dafür soll der Sicherheitsbestand an Fertigteilen von <b>500 auf 1.500 Stück</b> erhöht werden.`,
  parts:[
   {type:'choice',multi:true,label:'a) Welche zwei Ziele stehen hier im Konflikt? (beide ankreuzen)',options:['hohe Lieferbereitschaft / kurze Lieferzeit','niedrige Lagerkosten / geringe Kapitalbindung','Arbeitssicherheit','geringer CO₂-Ausstoß'],ans:[0,1]},
   {type:'choice',label:'b) Warum ist das ein Zielkonflikt?',options:[
     'Mehr Bestand macht die Lieferung schneller, kostet aber Lagerplatz, Zinsen und bindet Kapital.',
     'Mehr Bestand senkt automatisch die Lagerkosten.',
     'Die Lieferzeit hat mit dem Lagerbestand nichts zu tun.'],ans:[0]},
   {type:'choice',multi:true,label:'c) Mit welchen Maßnahmen kann man die Lieferzeit verkürzen, ohne den Lagerbestand zu erhöhen? (alle richtigen ankreuzen)',options:['Rüstzeiten senken','Liegezeiten in der Fertigung abbauen','Noch mehr Sicherheitsbestand','Beschaffungszeiten mit Lieferern verkürzen'],ans:[0,1,3]}
  ],
  hints:["Was verbessert sich durch den höheren Bestand – und was wird dadurch teurer?"],
  solution:`a) Lieferbereitschaft ↔ niedrige Lagerkosten/Kapitalbindung<br>b) Mehr Bestand = schneller lieferfähig, aber mehr Lager- und Kapitalkosten<br>c) Rüstzeiten senken, Liegezeiten abbauen, Beschaffung beschleunigen`
 }
]},
/* 2 */ {
title:"Kennzahlen: Wirtschaftlichkeit & Produktivität",
info:`
<h3>Wirtschaftlichkeit (Wertgröße)</h3>
<div class="formula">Wirtschaftlichkeit = Leistungen ÷ Kosten</div>
<p style="font-size:16px;color:var(--pencil)">✎ Manche Bücher rechnen mit Erträgen ÷ Aufwendungen. Leistungen/Kosten (Kostenrechnung) und Erträge/Aufwendungen (Buchführung) sind aber nicht immer gleich hoch – nimm, was in der Aufgabe steht.</p>
<p>Ergebnis <b>&gt; 1</b> → wirtschaftlich (es wird mehr erwirtschaftet als verbraucht). <b>= 1</b> → kostendeckend. <b>&lt; 1</b> → unwirtschaftlich.<br>Mit Werten in €, das Ergebnis hat keine Einheit.</p>
<h3>Produktivität (Mengengröße)</h3>
<div class="formula">Produktivität = Ausbringungsmenge ÷ Einsatzmenge</div>
<p>Sie misst die <b>mengenmäßige</b> Ergiebigkeit eines Produktionsfaktors – ohne Preise.</p>
<div class="box"><b class="t">Arbeitsproduktivität</b>
<div class="formula" style="margin:6px 0">Arbeitsproduktivität = Ausbringungsmenge ÷ geleistete Arbeitsstunden</div>
<b class="t">Mannproduktivität</b> (Pro-Kopf-Leistung)
<div class="formula" style="margin:6px 0">Mannproduktivität = Ausbringungsmenge ÷ Anzahl der Arbeitskräfte</div>
Weitere: Maschinenproduktivität (Stück je Maschinenstunde), Materialproduktivität (Stück je kg).</div>
<h3>Veränderung in Prozent</h3>
<div class="formula">Veränderung in % = (neuer Wert − alter Wert) ÷ alter Wert × 100</div>
<p class="red">Merke: Produktivität kann steigen, während die Wirtschaftlichkeit sinkt – z. B. wenn Löhne oder Materialpreise stark steigen. Gib bei Mannproduktivität immer den Zeitraum an (z. B. Stück je Mitarbeiter und Jahr).</p>`,
tasks:[
 {title:"Aufgabe 2.1",
  text:`Zahlen der Abteilung Gehäusebau:<br>${table3([["","2025","2026"],["Leistungen","2.400.000 €","2.700.000 €"],["Kosten","2.000.000 €","2.400.000 €"],["Ausbringung","48.000 Stück","54.000 Stück"],["Mitarbeiter","12","14"],["Arbeitsstunden je Mitarbeiter","1.600 h","1.600 h"]])}`,
  parts:[
   {type:'num',label:'a) Wirtschaftlichkeit 2025:',ans:1.2,unit:''},
   {type:'num',label:'b) Wirtschaftlichkeit 2026 (auf 3 Nachkommastellen genau):',ans:1.125,unit:'',tol:0.0051},
   {type:'num',label:'c) Arbeitsproduktivität 2025 (Stück je Stunde):',ans:2.5,unit:'Stk/h'},
   {type:'num',label:'d) Arbeitsproduktivität 2026 (auf 2 Nachkommastellen):',ans:2.41,unit:'Stk/h',tol:0.006},
   {type:'num',label:'e) Mannproduktivität 2025:',ans:4000,unit:'Stk je Mitarbeiter und Jahr'}
  ],
  hints:["Wirtschaftlichkeit rechnet mit €, Produktivität mit Mengen.","Arbeitsstunden gesamt = Mitarbeiter × Stunden je Mitarbeiter."],
  solution:`a) 2.400.000 ÷ 2.000.000 = <b>1,2</b><br>b) 2.700.000 ÷ 2.400.000 = <b>1,125</b><br>c) 48.000 ÷ (12 × 1.600 = 19.200 h) = <b>2,5 Stk/h</b><br>d) 54.000 ÷ (14 × 1.600 = 22.400 h) = <b>2,41 Stk/h</b><br>e) 48.000 ÷ 12 = <b>4.000 Stück</b>`
 },
 {title:"Aufgabe 2.2",

<p>Die Frage ist: <b>Wird produziert, bevor oder nachdem ein Kunde bestellt hat?</b></p>
<div class="box"><b class="t">Lagerfertigung (Vorratsfertigung)</b><br>
Produktion für einen <b>anonymen Markt</b> auf Vorrat, anschließend Verkauf ab Lager.<br>
✔ kurze Lieferzeiten · gleichmäßige Auslastung · große Stückzahlen, niedrige Stückkosten<br>
✘ <b>Absatzrisiko</b> (Ware bleibt liegen) · hohe <b>Kapitalbindung</b> & Lagerkosten · Veralterung<br>
<i>Beispiele: Schrauben, Waschmittel, Getränke, Standardmöbel</i><br><br>
<b class="t">Auftragsfertigung (Kundenauftragsfertigung)</b><br>
Produktion erst <b>nach Eingang eines Kundenauftrags</b>, oft nach individuellen Wünschen.<br>
✔ geringes Absatzrisiko (ein Kunde hat schon bestellt – Storno oder Zahlungsausfall bleiben möglich) · kaum Fertigwarenlager · Kundenwünsche erfüllbar<br>
✘ längere Lieferzeiten · ungleichmäßige Auslastung · höhere Stückkosten<br>
<i>Beispiele: Sondermaschinen, Brücken, Maßanzüge, Einbauküchen</i></div>
<p>Mischform: <b>Standardteile auf Lager</b>, Endmontage erst nach Kundenauftrag (z. B. Pkw mit Wunschausstattung).</p>
<p class="red">Nicht verwechseln: Auftragsfertigung heißt nicht automatisch Einzelfertigung! Ein Kunde kann auch 15.000 gleiche Teile bestellen → Auftragsfertigung <b>und</b> Serienfertigung. Lager/Auftrag fragt nach dem <b>Zeitpunkt der Bestellung</b>, Einzel/Serie/Masse nach der <b>Stückzahl</b>.</p>`,

/* 4 */ {
title:"Fertigungsverfahren: Einzel-, Serien-, Sorten-, Massenfertigung",
info:`
<p>Fertigungsverfahren unterscheiden sich nach der <span class="mark">Menge gleichartiger Erzeugnisse</span>, die hergestellt wird (auch „Fertigungsarten" genannt).</p>
<div class="box">
<b class="t">Einzelfertigung</b> – ein Stück (oder wenige) nach Kundenwunsch, kaum Wiederholung.<br><i>Brücke, Schiff, Sondermaschine, Maßanzug</i> → meist Auftragsfertigung, hohe Stückkosten, qualifizierte Fachkräfte<br><br>
<b class="t">Serienfertigung</b> – eine <b>begrenzte Menge</b> (Serie/Los) eines Produkts, danach wird die Anlage auf ein <b>anderes Produkt umgerüstet</b>.<br><i>Pkw-Modelle, Smartphones, Möbelprogramme</i> → Klein- oder Großserie, Rüstkosten bei jedem Wechsel<br><br>
<b class="t">Sortenfertigung</b> – Sonderform der Serie: <b>Varianten eines Grundprodukts</b> aus dem <b>gleichen Rohstoff</b> auf der gleichen Anlage, nur geringe Umstellung.<br><i>Biersorten, Schrauben in verschiedenen Längen, Bleche in verschiedenen Stärken, Zigarettensorten</i><br><br>
<b class="t">Massenfertigung</b> – ein <b>gleiches Produkt</b> in sehr großer, <b>unbegrenzter Menge</b> über lange Zeit, ohne Umrüsten.<br><i>Strom, Zement, Zucker, Kronkorken</i> → niedrigste Stückkosten, hoher Automatisierungsgrad, wenig flexibel</div>
<div class="formula">Einzel → Serie → Masse: Stückzahl ↑ · Stückkosten ↓ · Flexibilität ↓ · Automatisierung ↑</div>
<p>Die Sortenfertigung ist eine <b>Sonderform der Serienfertigung</b> und keine eigene „Stufe" dazwischen.</p>
<p class="red">Serie oder Sorte? Bei Sorten sind die Produkte nur leicht abgewandelt (gleicher Rohstoff, gleicher Prozess). Bei Serien sind es wirklich verschiedene Produkte.</p>`,
tasks:[
 {title:"Aufgabe 4.1",
  text:`Ordne das passende Fertigungsverfahren zu.`,
  parts:[
   {type:'pick',label:'a) Ein Kraftwerk erzeugt rund um die Uhr Strom.',options:['Einzelfertigung','Serienfertigung','Sortenfertigung','Massenfertigung'],ans:3},
   {type:'pick',label:'b) Eine Werft baut ein Kreuzfahrtschiff.',options:['Einzelfertigung','Serienfertigung','Sortenfertigung','Massenfertigung'],ans:0},
   {type:'pick',label:'c) Ein Walzwerk stellt Bleche in 1 mm, 2 mm und 3 mm Stärke her.',options:['Einzelfertigung','Serienfertigung','Sortenfertigung','Massenfertigung'],ans:2},
   {type:'pick',label:'d) Ein Autohersteller baut 30.000 Stück des Modells A, dann wird die Linie auf Modell B umgestellt.',options:['Einzelfertigung','Serienfertigung','Sortenfertigung','Massenfertigung'],ans:1},
   {type:'pick',label:'e) Eine Brauerei braut nacheinander Pils, Export und Weizen.',options:['Einzelfertigung','Serienfertigung','Sortenfertigung','Massenfertigung'],ans:2}
  ],
  hints:["Erste Frage: Wie viele Stück? Zweite Frage: Wird umgerüstet – und wenn ja, auf ein ganz anderes Produkt oder nur eine Variante?"],
  solution:`a) Masse · b) Einzel · c) Sorte · d) Serie · e) Sorte`
 },
 {title:"Aufgabe 4.2",
  text:`Vergleich der Verfahren.`,
  parts:[
   {type:'choice',label:'a) Bei welchem Verfahren sind die Stückkosten in der Regel am niedrigsten?',options:['Einzelfertigung','Serienfertigung','Massenfertigung'],ans:[2]},
   {type:'choice',multi:true,label:'b) Welche Aussagen zur Einzelfertigung stimmen? (alle richtigen ankreuzen)',options:['Sie ist meist Auftragsfertigung.','Sie braucht hoch qualifizierte Fachkräfte.','Sie hat einen sehr hohen Automatisierungsgrad.','Sie ist sehr flexibel gegenüber Kundenwünschen.'],ans:[0,1,3]}

title:"Fertigungstypen: Werkstatt-, Reihen-, Fließ-, Gruppenfertigung",
info:`
<p>Fertigungstypen (Organisationstypen) beschreiben, <span class="mark">wie die Maschinen und Arbeitsplätze räumlich angeordnet</span> sind.</p>
<div class="box">
<b class="t">Werkstattfertigung</b> (Verrichtungsprinzip)<br>Gleichartige Maschinen stehen in einer Werkstatt zusammen (Dreherei, Fräserei, Lackiererei). Das Werkstück wandert von Werkstatt zu Werkstatt.<br>✔ sehr flexibel, gut für Einzel- und Kleinserien · ✘ lange Transportwege, Zwischenlager, <b>lange Durchlaufzeiten</b><br><br>
<b class="t">Reihenfertigung</b> (Objektprinzip, ohne Zeittakt)<br>Maschinen stehen in der <b>Reihenfolge der Arbeitsgänge</b> hintereinander – aber <b>ohne festen Takt</b>; kleine Puffer zwischen den Plätzen.<br>✔ kürzere Wege als Werkstatt · ✘ weniger flexibel, Puffer nötig<br><br>
<b class="t">Fließfertigung</b> (Objektprinzip, mit Zeittakt)<br>Wie Reihe, aber das Werkstück läuft im <b>festen Takt</b> (Fließband) von Station zu Station.<br>✔ <b>kürzeste Durchlaufzeit</b>, niedrige Stückkosten · ✘ hohe Investition, unflexibel, eine Störung kann die ganze Linie aufhalten, <b>monotone Arbeit</b><br><br>
<b class="t">Gruppenfertigung</b> (Fertigungsinseln)<br>Eine Gruppe von Mitarbeitern stellt mit den nötigen Maschinen ein Teil oder eine Baugruppe <b>komplett</b> her und organisiert sich selbst (teilautonom, Job-Rotation).<br>✔ hohe Motivation, abwechslungsreich, flexibel · ✘ hoher Qualifikations- und Abstimmungsbedarf</div>
<p style="font-size:16px;color:var(--pencil)">✎ Manche Bücher zählen die Reihenfertigung als Form der Fließfertigung – nimm im Zweifel die Einteilung eurer Lehrkraft.</p>
<p class="red">Merke: Werkstatt = Maschinen nach <b>Tätigkeit</b> sortiert. Reihe/Fließ = Maschinen nach <b>Ablauf des Produkts</b> sortiert. Unterschied Reihe ↔ Fließ = der <b>Zeittakt</b>.</p>`,

/* 6 */ {
title:"Optimale Losgröße",
info:`
<p>Bei Serienfertigung muss man entscheiden: <b>Wie viele Stück fertige ich auf einmal (ein Los), bevor ich umrüste?</b></p>
<div class="box"><b class="t">Zwei gegenläufige Kosten</b><br>
<b>Rüstkosten</b> (losfixe Kosten): fallen bei <b>jedem Los</b> an (Maschine umbauen, einstellen, Probelauf). Große Lose → wenige Rüstvorgänge → <b>niedrige</b> Rüstkosten.<br>
<b>Lagerkosten</b>: Was produziert, aber noch nicht gebraucht wird, liegt im Lager. Große Lose → hoher Lagerbestand → <b>hohe</b> Lagerkosten.</div>
<p>Die <span class="mark">optimale Losgröße</span> ist dort, wo die <b>Summe</b> aus Rüst- und Lagerkosten am kleinsten ist. Im Andler-Modell sind Rüst- und Lagerkosten dort <b>genau gleich hoch</b>.</p>
<h3>Tabellen-Methode</h3>
<div class="formula">Rüstkosten/Jahr = Anzahl Lose × Rüstkosten je Los</div>
<div class="formula">Ø Lagerbestand = Losgröße ÷ 2</div>
<div class="formula">Lagerkosten/Jahr = Ø Lagerbestand × Herstellkosten/Stück × Lagerkostensatz</div>
<h3>Andler-Formel</h3>
<div class="formula">x<sub>opt</sub> = √( 200 × Jahresbedarf × Rüstkosten je Los ÷ (Herstellkosten/Stück × Lagerkostensatz in %) )</div>
<p>Beispiel: Bedarf 1.800 Stk, Rüstkosten 100 €, Herstellkosten 10 €, Lagerkostensatz 20 % →<br>√(200 × 1.800 × 100 ÷ (10 × 20)) = √180.000 ≈ <b>424 Stück</b></p>
<p>Der Lagerkostensatz wird als <b>Prozentzahl</b> eingesetzt (10 % → 10, nicht 0,10).</p>
<p class="red">Anzahl Lose = Jahresbedarf ÷ Losgröße. Die Annahmen (gleichmäßiger Verbrauch, konstante Kosten) sind vereinfacht. In der Praxis begrenzen Maschinenkapazität, Mindestlose und Lagerplatz das Ergebnis – dann vergleicht man die möglichen Losgrößen mit der Tabellen-Methode.</p>`,

 {title:"Aufgabe 6.1 – Tabelle",
  text:`Für ein Drehteil gilt: Jahresbedarf <b>5.000 Stück</b>, Rüstkosten <b>500 € je Los</b>, Herstellkosten <b>50 € je Stück</b>, Lagerkostensatz <b>10 %</b>.<br>
  ${calc([["Lose/Jahr","Losgröße → Rüstk. · Lagerk. · Summe"],["2","2.500 Stk → 1.000 € · 6.250 € · 7.250 €"],["4","1.250 Stk → ? · ? · ?"],["5","1.000 Stk → ? · ? · ?"],["10","500 Stk → 5.000 € · 1.250 € · 6.250 €"]])}`,

   {type:'num',label:'b) Gesamtkosten (Rüst + Lager) bei 4 Losen:',ans:5125,unit:'€'},
   {type:'num',label:'c) Gesamtkosten bei 5 Losen:',ans:5000,unit:'€'},
   {type:'num',label:'d) Welche Losgröße ist laut Tabelle optimal?',ans:1000,unit:'Stück'}
  ],
  hints:["Ø Lagerbestand = Losgröße ÷ 2. Lagerkosten = Ø Bestand × 50 € × 10 %.","Rüstkosten = Anzahl Lose × 500 €. Optimal ist die Zeile mit der kleinsten Summe."],
  solution:`a) 1.250 ÷ 2 = <b>625 Stück</b><br>b) Rüst 4 × 500 = 2.000 € + Lager 625 × 50 × 0,1 = 3.125 € → <b>5.125 €</b><br>c) Rüst 2.500 € + Lager 500 × 5 = 2.500 € → <b>5.000 €</b><br>d) <b>1.000 Stück</b> (5 Lose) – hier sind Rüst- und Lagerkosten gleich hoch.`
 },
 {title:"Aufgabe 6.2 – Andler",
  text:`Ein Blechteil: Jahresbedarf <b>12.000 Stück</b>, Rüstkosten <b>300 € je Los</b>, Herstellkosten <b>40 € je Stück</b>, Lagerkostensatz <b>12,5 %</b>.`,
  parts:[
   {type:'num',label:'a) Optimale Losgröße nach Andler:',ans:1200,unit:'Stück'},
   {type:'num',label:'b) Wie viele Lose werden pro Jahr gefertigt?',ans:10,unit:'Lose'},
   {type:'choice',label:'c) Die Rüstkosten sinken durch eine Schnellwechsel-Vorrichtung. Was passiert mit der optimalen Losgröße?',options:['Sie steigt.','Sie sinkt.','Sie bleibt gleich.'],ans:[1]}

  hints:["Setz ein: 200 × 12.000 × 300 ÷ (40 × 12,5). Danach die Wurzel ziehen.","Rüstkosten stehen im Zähler unter der Wurzel."],

 },
 {title:"Aufgabe 6.3 – Theorie trifft Praxis",
  text:`Ein Bauteil: Jahresbedarf <b>9.600 Stück</b>, Rüstkosten <b>150 € je Los</b>, Herstellkosten <b>30 € je Stück</b>, Lagerkostensatz <b>20 %</b>. Die Maschine kann aus organisatorischen Gründen nur Lose von <b>600</b> oder <b>800 Stück</b> fertigen.`,

/* 7 */ {
title:"Make-or-Buy-Entscheidung",
info:`
<p>Soll ein Bauteil <b>selbst hergestellt</b> (Make) oder <b>fremd bezogen</b> (Buy) werden?</p>
<h3>1. Kostenvergleich (langfristig)</h3>
<div class="formula">Kosten Eigenfertigung = Fixkosten + variable Stückkosten × Menge</div>
<div class="formula">Kosten Fremdbezug = Bezugspreis × Menge</div>
<h3>2. Kritische Menge</h3>
<p>Bei dieser Menge sind beide Alternativen gleich teuer:</p>
<div class="formula">kritische Menge = Fixkosten ÷ (Bezugspreis − variable Stückkosten)</div>
<p>Bedarf <b>über</b> der kritischen Menge → <b>Eigenfertigung</b> günstiger. Bedarf <b>darunter</b> → <b>Fremdbezug</b>. (Funktioniert nur, wenn der Bezugspreis höher ist als die variablen Stückkosten.)</p>
<p>Zum Bezugspreis gehören auch <b>Bezugskosten</b> wie Fracht oder Verpackung je Stück!</p>
<div class="box"><b class="t">Kurzfristig mit freier Kapazität</b><br>
Entscheidend sind nur die Kosten, die sich durch die Entscheidung <b>ändern</b>. Sind Maschinen und Personal ohnehin da (Fixkosten fallen sowieso an), sind das meist nur die <b>variablen Kosten</b>: Eigenfertigung lohnt sich, wenn variable Stückkosten &lt; Bezugspreis.</div>
<h3>3. Qualitative Gründe</h3>
<p><b>Für Make:</b> Know-how bleibt im Haus · Qualität selbst steuern · keine Abhängigkeit von Lieferern · freie Kapazitäten auslasten<br>
<b>Für Buy:</b> keine Investitionen · Spezialwissen des Lieferers · flexibler bei schwankendem Bedarf · Konzentration aufs Kerngeschäft</p>`,
tasks:[
 {title:"Aufgabe 7.1",
  text:`Bubbel Metallbau braucht Scharniere. Eigenfertigung: Fixkosten <b>36.000 €/Jahr</b>, variable Kosten <b>14 €/Stück</b>. Ein Lieferer bietet sie für <b>20 €/Stück</b> an. Der Jahresbedarf beträgt <b>8.000 Stück</b>.`,

   {type:'num',label:'c) Kritische Menge:',ans:6000,unit:'Stück'},
   {type:'pick',label:'d) Der Bedarf sinkt auf 5.000 Stück. Was ist dann günstiger?',options:['Eigenfertigung','Fremdbezug','beides gleich'],ans:1}
  ],
  hints:["Eigenfertigung: Fixkosten + variable Kosten × Menge.","Kritische Menge = Fixkosten ÷ Unterschied je Stück (Bezugspreis − variable Kosten)."],
  solution:`a) 36.000 + 14 × 8.000 = <b>148.000 €</b><br>b) 20 × 8.000 = <b>160.000 €</b><br>c) 36.000 ÷ (20 − 14) = <b>6.000 Stück</b><br>d) 5.000 &lt; 6.000 → <b>Fremdbezug</b> (Eigen: 106.000 €, Fremd: 100.000 €)`
 },
 {title:"Aufgabe 7.2",
  text:`Die Fräsabteilung hat gerade <b>freie Kapazitäten</b>. Maschinen und Personal werden ohnehin bezahlt. Ein Bauteil kostet im Einkauf <b>9,50 €</b>; selbst gefertigt fallen nur <b>6,80 €</b> variable Kosten an.`,

   {type:'choice',multi:true,label:'c) Welche Argumente sprechen trotzdem für den Fremdbezug? (alle richtigen ankreuzen)',options:['Der Lieferer hat Spezialwissen und bessere Qualität.','Das Know-how bleibt im eigenen Haus.','Der Bedarf schwankt stark.','Das Unternehmen will sich aufs Kerngeschäft konzentrieren.','Man ist unabhängig von Lieferern.'],ans:[0,2,3]}

 {title:"Aufgabe 7.3 – mit Bezugskosten",
  text:`Jahresbedarf <b>12.000 Gehäuse</b>. Eigenfertigung: Fixkosten <b>48.000 €</b>, variable Kosten <b>8,00 €/Stück</b>. Fremdbezug: Einkaufspreis <b>13,00 €</b> zzgl. <b>0,50 €</b> Transportkosten je Stück.`,

info:`
<p>Um zu wissen, wie viel Material bestellt werden muss, nutzt man <span class="mark">Fertigungsunterlagen</span>: Stücklisten, Erzeugnisstruktur und Arbeitspläne.</p>
<h3>Erzeugnisstruktur (Strukturbaum)</h3>
<p>Zeigt, aus welchen Baugruppen und Einzelteilen ein Produkt besteht – in <b>Fertigungsstufen</b>. Die Zahl an der Linie gibt die Menge <b>je übergeordnetem Teil</b> an.</p>
<div class="tree"><b>Fahrradständer</b> (Stufe 0)
<ul><li>2 × Seitenteil (Stufe 1)<ul><li>1 × Rohr (Stufe 2)</li><li>2 × Fußkappe (Stufe 2)</li></ul></li><li>1 × Querstrebe (Stufe 1)</li><li>4 × Schraube (Stufe 1)</li></ul></div>
<p>Je Fahrradständer: 2 Seitenteile → 2 × 1 = 2 Rohre, 2 × 2 = <b>4 Fußkappen</b> (Mengen entlang des Astes <b>multiplizieren</b>!).</p>
<h3>Stücklisten-Arten</h3>
<ul>
<li><b>Mengenübersichtsstückliste:</b> alle Teile mit Gesamtmenge je Erzeugnis, <b>ohne</b> Struktur.</li>
<li><b>Strukturstückliste:</b> alle Teile <b>mit</b> Fertigungsstufen – zeigt den kompletten Aufbau.</li>
<li><b>Baukastenstückliste:</b> nur die <b>direkt</b> darunterliegende Stufe einer Baugruppe.</li>
</ul>
<h3>Vom Brutto- zum Nettobedarf</h3>
${calc([["Bruttobedarf (Menge × Teile je Erzeugnis)",""],["− Lagerbestand",""],["+ Sicherheitsbestand (darf nicht angetastet werden)",""],["− Bestellbestand (schon bestellt, kommt rechtzeitig)",""],["+ Vormerkbestand (für andere Aufträge reserviert)",""],["= Nettobedarf (muss beschafft werden)","",1]])}
<p class="red">Kommt ein negativer Nettobedarf heraus, muss nichts beschafft werden (Nettobedarf = 0). Ausschuss im Lager zählt nicht zum verfügbaren Bestand.</p>`,

/* 9 */ {
title:"Ermittlung der Durchlaufzeit",
info:`
<p>Die <span class="mark">Durchlaufzeit</span> ist die Zeit vom Beginn des ersten Arbeitsgangs bis zum Ende des letzten – also wie lange ein Auftrag durch die Fertigung „läuft".</p>
<div class="formula">Durchlaufzeit = Rüstzeiten + Ausführungszeiten + Transportzeiten + Liegezeiten (+ Kontrollzeiten)</div>
<div class="box"><b class="t">Bausteine je Arbeitsgang</b><br>
<b>Rüstzeit (t<sub>r</sub>)</b>: Maschine vorbereiten – fällt <b>einmal je Auftrag/Los</b> an<br>
<b>Ausführungszeit</b> = Menge × Stückzeit (t<sub>e</sub>)<br>
<b>Auftragszeit</b> = Rüstzeit + Ausführungszeit (= Bearbeitungszeit eines Arbeitsgangs)<br>
<b>Transportzeit</b>: zwischen den Arbeitsplätzen<br>
<b>Liegezeit</b>: Warten vor/nach der Bearbeitung (oft der größte Anteil!)</div>
<p>Die Angaben stehen im <b>Arbeitsplan</b>: Reihenfolge der Arbeitsgänge, Maschine, Rüst- und Stückzeit.</p>
<p class="red">Die einfache Summe gilt nur, wenn alle Schritte <b>nacheinander</b> ablaufen (erst das ganze Los fertig, dann weiter). Werden Teilmengen schon weitergegeben oder läuft etwas parallel, ist die Durchlaufzeit kürzer. Die Auftragszeit ist nur ein Teil der Durchlaufzeit!</p>
<h3>Durchlaufzeit verkürzen</h3>
<p>Liegezeiten abbauen · Transportwege verkürzen · Rüstzeiten senken · Arbeitsgänge <b>überlappen</b> (Teilmengen schon weitergeben) · Arbeitsgänge parallel auf mehreren Maschinen</p>
<h3>Fertigstellungstermin</h3>
<p>Durchlaufzeit in Stunden ÷ Arbeitsstunden pro Tag → so viele Arbeitstage. Wochenenden zählen nicht!</p>`,

  Zusätzlich: vor jedem Arbeitsgang <b>60 min Liegezeit</b>, zwischen den Arbeitsgängen jeweils <b>40 min Transport</b>, am Ende <b>30 min Endkontrolle</b>. Alle Schritte laufen nacheinander ab.`,

 },

/* ---------- Zahlen einlesen ---------- */
function parseNum(s){
  if(s==null) return NaN; s=String(s).replace(/[€%\s]/g,'').replace(/[a-zA-Z]/g,'');
  if(!s) return NaN;
  if(s.includes(',')){ s=s.replace(/\./g,'').replace(',','.'); }
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){ s=s.replace(/\./g,''); }
  return parseFloat(s);
}
const near=(a,b,t=0.011)=>Math.abs(a-b)<=t;

/* ---------- Rendering ---------- */

const kontoOpts = sel => '<option value="">– Konto wählen –</option>'+Object.keys(KONTEN).map(k=>`<option value="${k}" ${k===sel?'selected':''}>${k} ${KONTEN[k]}</option>`).join('');

function renderTask(ti,j,task){
  const id=ti+'-'+j, ex=TOPICS[ti].exam, res=ex&&S.exam?S.exam.res[id]:null;
  const solved=ex?!!S.exam:S.solved[id], tries=S.tries[id]||0, opened=S.hints[id]||0;
  const badge = ex ? (res?`<span class="state ${res.every(x=>x)?'ok':'bad'}">${task.parts.reduce((a,p,k)=>a+(res[k]?pts(p):0),0)} / ${task.parts.reduce((a,p)=>a+pts(p),0)} P.</span>`:`<span class="state" style="color:var(--pencil);font-size:22px">(${task.parts.reduce((a,p)=>a+pts(p),0)} P.)</span>`)
                   : (solved?'<span class="state ok">✔ richtig!</span>':'');
  let h=`<div class="task" data-task="${id}"><h3>${task.title} ${badge}</h3><div class="txt">${task.text}</div>`;
  task.parts.forEach((p,k)=>{
    const mk = res ? (res[k]?'<span class="state ok" data-st>✔</span>':'<span class="state bad" data-st>✘</span>') : '<span class="state" data-st></span>';
    h+=`<div class="part" data-part="${k}"><div class="lbl">${p.label} ${mk}</div>`;
    if(p.type==='num') h+=`<input class="num" inputmode="decimal" autocomplete="off" ${solved?`value="${fmtAns(p)}" disabled`:''}><span class="unit">${p.unit||''}</span>`;
    if(p.type==='choice'){ h+='<div class="choice">'+p.options.map((o,m)=>`<label><input type="${p.multi?'checkbox':'radio'}" name="c${id}-${k}" value="${m}" ${solved&&p.ans.includes(m)?'checked':''} ${solved?'disabled':''}>${o}</label>`).join('')+'</div>'; }
    if(p.type==='pick'){ h+=`<select ${solved?'disabled':''}><option value="">– wählen –</option>${p.options.map((o,m)=>`<option value="${m}" ${solved&&p.ans===m?'selected':''}>${o}</option>`).join('')}</select>`; }
    if(p.type==='book'){
      const side=(name,rows)=>`<div class="side" data-side="${name}"><div class="cap">${name==='s'?'Soll':'Haben'}</div>${rows.map(r=>brow(r)).join('')}${solved?'':'<button class="mini" data-add>+ Zeile</button>'}</div>`;
      const sr=solved?p.soll:[[ '',null]], hr=solved?p.haben:[[ '',null]];
      h+=`<div class="book">${side('s',sr)}<div class="an">an</div>${side('h',hr)}</div><div class="sumline" data-sum></div><div class="rowmsg" data-rowmsg></div>`;
    }
    h+='</div>';
  });
  if(!solved && !ex){
    h+=`<div class="actions"><button class="pen" data-check>✓ Prüfen</button><span class="fb" data-fb></span>
      ${tries>=3?`<button class="mini" data-sol>👀 Lösungsweg ansehen</button>`:''}</div>`;
  }
  h+=`<div class="hints">${task.hints.map((x,m)=>`<div class="hint">${x}<div class="cover ${m<opened||solved?'open':''} ${m>opened?'locked':''}" data-hint="${m}">${m>opened?'🔒 ':''}Hinweis ${m+1}</div></div>`).join('')}</div>`;
  h+=`<div class="solution ${solved?'show':''}" data-solbox><b>Lösung:</b><br>${task.solution}</div></div>`;
  return h;
}
function fmtAns(p){ return p.unit==='%'||p.unit==='Monate'||p.ans<1 ? String(p.ans).replace('.',',') : eur(p.ans); }
function brow(r){ const a=r[1]; return `<div class="brow"><select ${a!=null?'disabled':''}>${kontoOpts(r[0])}</select><input class="num" inputmode="decimal" placeholder="Betrag €" ${a!=null?`value="${eur(a)}" disabled`:''}>${a!=null?'':'<button class="mini" data-del>✕</button>'}</div>`; }

function isDone(ti){ return TOPICS[ti].exam ? !!S.exam : TOPICS[ti].tasks.every((_,j)=>S.solved[ti+'-'+j]); }
const pts = p => p.pts || (p.type==='book'?2:1);
function note(pc){ return pc>=92?'1 (sehr gut)':pc>=81?'2 (gut)':pc>=67?'3 (befriedigend)':pc>=50?'4 (ausreichend)':pc>=30?'5 (mangelhaft)':'6 (ungenügend)'; }
function scoreBox(){
  const e=S.exam, pc=Math.round(e.pts/e.max*1000)/10;
  return `<div class="box" style="text-align:center"><b class="t">Ergebnis: ${e.pts} von ${e.max} Punkten (${String(pc).replace('.',',')} %)</b><br>
  <span class="stamp" style="margin:8px 0">Note ${note(pc)}</span><br>
  Schau dir bei den roten ✘ die Lösung unter der Aufgabe an.<br><button class="mini" id="retryExam">↺ Klausur nochmal schreiben</button></div>`;
}

/* ---------- Prüfen ---------- */
function readBook(el){
  const sum={}; let bad=false;
  el.querySelectorAll('.brow').forEach(r=>{
    const k=r.querySelector('select').value, v=parseNum(r.querySelector('input').value);
    if(!k && !r.querySelector('input').value.trim()) return;
    if(!k||isNaN(v)){bad=true;return;}
    sum[k]=(sum[k]||0)+v;
  });
  return bad?null:sum;
}
function sameMap(a,b){
  const ka=Object.keys(a), kb=Object.keys(b); if(ka.length!==kb.length) return false;
  return kb.every(k=>k in a && near(a[k],b[k]));
}
function toMap(rows){const m={}; rows.forEach(r=>m[r[0]]=(m[r[0]]||0)+r[1]); return m;}

/* Teil bewerten (+ Zeilen-Feedback bei Buchungssätzen) */
function gradePart(pe,p,detail=true){
  let ok=false;
  if(p.type==='num'){ ok=near(parseNum(pe.querySelector('input').value),p.ans,p.tol||0.011); }
  if(p.type==='choice'){ const sel=[...pe.querySelectorAll('input:checked')].map(x=>+x.value).sort(); ok=sel.join()===[...p.ans].sort().join(); }
  if(p.type==='pick'){ ok=pe.querySelector('select').value===String(p.ans); }
  if(p.type==='book'){
    const variants=[{soll:p.soll,haben:p.haben},...(p.alts||[])];
    const s=readBook(pe.querySelector('[data-side="s"]')), h=readBook(pe.querySelector('[data-side="h"]'));
    ok=!!(s&&h&&variants.some(v=>sameMap(s,toMap(v.soll))&&sameMap(h,toMap(v.haben))));
    if(detail) markRows(pe,variants,ok);
  }
  const st=pe.querySelector('[data-st]'); st.textContent=ok?'✔':'✘'; st.className='state '+(ok?'ok':'bad');
  return ok;
}
function sideSums(sideEl){ const m={}; sideEl.querySelectorAll('.brow').forEach(r=>{const k=r.querySelector('select').value,v=parseNum(r.querySelector('input').value); if(k&&!isNaN(v)) m[k]=(m[k]||0)+v;}); return m; }
function markRows(pe,variants,ok){
  const sE=pe.querySelector('[data-side="s"]'), hE=pe.querySelector('[data-side="h"]');
  const got={s:sideSums(sE),h:sideSums(hE)};
  let best=null;
  variants.forEach(v=>{
    const E={s:toMap(v.soll),h:toMap(v.haben)}, marks=[]; let good=0;
    [['s',sE,'h'],['h',hE,'s']].forEach(([sd,el,ot])=>el.querySelectorAll('.brow').forEach(r=>{
      const k=r.querySelector('select').value, raw=r.querySelector('input').value.trim();
      let m='';
      if(!k&&!raw) m='';
      else if(!k) m='<span class="bad">Konto fehlt</span>';
      else if(k in E[sd]) { if(near(got[sd][k],E[sd][k])){m='<span class="ok">✔</span>';good++;} else m='<span class="bad">Betrag prüfen</span>'; }
      else if(k in E[ot]) m='<span class="bad">↔ falsche Seite</span>';
      else m='<span class="bad">✘ Konto passt nicht</span>';
      marks.push([r,m]);
    }));
    const missing=['s','h'].reduce((a,sd)=>a+Object.keys(E[sd]).filter(k=>!(k in got.s)&&!(k in got.h)).length,0);
    if(!best||good>best.good) best={marks,good,missing};
  });
  best.marks.forEach(([r,m])=>{ let f=r.querySelector('.rfb'); if(!f){f=document.createElement('span');f.className='rfb';r.appendChild(f);} f.innerHTML=m; });
  const msg=pe.querySelector('[data-rowmsg]');
  if(msg) msg.innerHTML = !ok && best.missing>0 ? `<span class="bad">${best.missing===1?'Da fehlt noch ein Konto':'Da fehlen noch '+best.missing+' Konten'} …</span>` : '';
}
function updateSums(root){
  root.querySelectorAll('.part').forEach(pe=>{
    const line=pe.querySelector('[data-sum]'); if(!line) return;
    const s=Object.values(sideSums(pe.querySelector('[data-side="s"]'))).reduce((a,b)=>a+b,0);
    const h=Object.values(sideSums(pe.querySelector('[data-side="h"]'))).reduce((a,b)=>a+b,0);
    if(!s&&!h){line.innerHTML='';return;}
    const eq=near(s,h);
    line.innerHTML=`Σ Soll ${eur(s)} · Σ Haben ${eur(h)} <span class="${eq?'ok':'bad'}">${eq?'✔ ausgeglichen':'≠ geht noch nicht auf'}</span>`;
  });
}
function submitExam(ti){
  const T=TOPICS[ti]; let p=0,max=0; const res={};
  T.tasks.forEach((task,j)=>{
    const id=ti+'-'+j, el=$page.querySelector(`[data-task="${id}"]`);
    res[id]=task.parts.map((pt,k)=>{ const ok=gradePart(el.querySelector(`[data-part="${k}"]`),pt); max+=pts(pt); if(ok)p+=pts(pt); return ok; });
    el.querySelectorAll('input,select').forEach(x=>x.disabled=true);
    el.querySelectorAll('[data-add],[data-del]').forEach(x=>x.remove());
    el.querySelector('[data-solbox]').classList.add('show');
  });
  S.exam={pts:p,max,res}; S.unlocked=NPAGES-1; save();
  $page.querySelector('#examFooter').innerHTML=scoreBox();
  const nb=$page.querySelector('.nav [data-nav="1"]'); if(nb){ nb.textContent='Fertig! →'; nb.classList.remove('skip'); }
  bind(); progress();
  $page.querySelector('#examFooter').scrollIntoView({behavior:'smooth',block:'center'});
}

function checkTask(ti,j,el){
  const task=TOPICS[ti].tasks[j], id=ti+'-'+j; let all=true;
  task.parts.forEach((p,k)=>{ if(!gradePart(el.querySelector(`[data-part="${k}"]`),p)) all=false; });
  const fb=el.querySelector('[data-fb]');
  if(all){ S.solved[id]=true; save(); fb.innerHTML='<span class="ok">Super, alles richtig! 🎉</span>';
    if(isDone(ti)){ S.unlocked=Math.max(S.unlocked,Math.min(NPAGES-1,2+2*(ti+1))); save(); }
    setTimeout(render,900);
  } else {
    S.tries[id]=(S.tries[id]||0)+1; save();
    const msgs=['Nicht ganz – schau dir die roten ✘ nochmal an.','Fast! Grübel nochmal kurz…','Hmm, vielleicht hilft ein Hinweis-Zettel?'];
    fb.innerHTML=`<span class="bad">${msgs[Math.min(S.tries[id]-1,2)]}</span>`;
    if(S.tries[id]===3 && !el.querySelector('[data-sol]')){
      const b=document.createElement('button'); b.className='mini'; b.dataset.sol=''; b.textContent='👀 Lösungsweg ansehen';
      fb.after(b); b.onclick=()=>el.querySelector('[data-solbox]').classList.add('show');
    }
  }
}

/* ---------- Events ---------- */
function bind(){
  $page.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
    const n=S.page+ +b.dataset.nav; if(n<0||n>=NPAGES) return;
    S.page=n; save(); render();
  });
  const lc=$page.querySelector('#loadCode'); if(lc) lc.onclick=()=>{
    const msg=$page.querySelector('#codeMsg');
    if(applyCode($page.querySelector('#codeIn').value)){ msg.innerHTML='<span class="ok">Geladen! ✔</span>'; setTimeout(render,700); }
    else msg.innerHTML='<span class="bad">Der Code stimmt nicht – vertippt?</span>';
  };
  const ci=$page.querySelector('#codeIn'); if(ci) ci.addEventListener('keydown',e=>{ if(e.key==='Enter') lc.click(); });
  $page.querySelectorAll('[data-go]').forEach(li=>li.onclick=()=>{ if(li.dataset.go){S.page=+li.dataset.go; save(); render();} });
  const r=$page.querySelector('#reset'); if(r) r.onclick=()=>{ if(confirm('Wirklich alles zurücksetzen?')){ S={page:0,unlocked:2,solved:{},tries:{},hints:{}}; save(); render(); } };
  const se=$page.querySelector('#submitExam'); if(se) se.onclick=()=>{ if(confirm('Klausur wirklich abgeben? Danach kannst du nichts mehr ändern.')) submitExam(pageInfo(S.page).t); };
  const re=$page.querySelector('#retryExam'); if(re) re.onclick=()=>{ delete S.exam; save(); render(); };
  $page.querySelectorAll('.task').forEach(el=>{
    const [ti,j]=el.dataset.task.split('-').map(Number), id=el.dataset.task;
    const c=el.querySelector('[data-check]'); if(c) c.onclick=()=>checkTask(ti,j,el);
    const so=el.querySelector('[data-sol]'); if(so) so.onclick=()=>el.querySelector('[data-solbox]').classList.add('show');
    el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ b.insertAdjacentHTML('beforebegin',brow(['',null])); bindRows(el); });
    bindRows(el);
    el.querySelectorAll('[data-hint]').forEach(cv=>cv.onclick=()=>{
      const m=+cv.dataset.hint, opened=S.hints[id]||0; if(m!==opened) return;
      S.hints[id]=opened+1; save(); cv.classList.add('open');
      const nx=el.querySelector(`[data-hint="${m+1}"]`); if(nx){ nx.classList.remove('locked'); nx.textContent='Hinweis '+(m+2); }
    });
    el.querySelectorAll('input.num').forEach(inp=>inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&c) c.click(); }));
  });
}
function bindRows(el){ el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const side=b.closest('.side'); if(side.querySelectorAll('.brow').length>1) b.closest('.brow').remove(); }); }
function progress(){
  const total=TOPICS.filter(t=>!t.exam).reduce((a,t)=>a+t.tasks.length,0), done=Object.keys(S.solved).length;
  document.getElementById('bar').style.width=(done/total*100)+'%';
  document.getElementById('tbr').textContent=`${done}/${total} Aufgaben${S.exam?' · Klausur ✔':''}`;
  updateSums($page);
}
/* ---------- Speicher-Code ---------- */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function codeFields(){ // feste Reihenfolge aller gespeicherten Felder
  const f=[['page',5]];
  TOPICS.forEach((t,ti)=>{
    if(t.exam){ f.push(['exam',1]); t.tasks.forEach((task,j)=>task.parts.forEach((_,k)=>f.push(['ex',1,ti+'-'+j,k]))); }
    else t.tasks.forEach((_,j)=>{ f.push(['sol',1,ti+'-'+j]); f.push(['hin',2,ti+'-'+j]); });
  });
  return f;
}
function checksum(s){ let c=7; for(let i=0;i<s.length;i++) c=(c*31+B36.indexOf(s[i])*(i+3))%1296; return B36[Math.floor(c/36)]+B36[c%36]; }
function makeCode(){
  let n=0n, w=0n;
  codeFields().forEach(([k,b,id,x])=>{
    let v=0;
    if(k==='page') v=S.page; else if(k==='exam') v=S.exam?1:0;
    else if(k==='ex') v=S.exam&&S.exam.res[id]&&S.exam.res[id][x]?1:0;
    else if(k==='sol') v=S.solved[id]?1:0; else if(k==='hin') v=Math.min(S.hints[id]||0,3);
    n|=BigInt(v)<<w; w+=BigInt(b);
  });
  const body=n.toString(36).toUpperCase();
  return ('B'+body+checksum(body)).match(/.{1,4}/g).join('-');
}
function applyCode(code){
  const s=String(code||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(s.length<4||s[0]!=='B') return false;
  const body=s.slice(1,-2); if(!body||checksum(body)!==s.slice(-2)) return false;
  let n=0n; for(const c of body) n=n*36n+BigInt(B36.indexOf(c));
  const NS={page:0,unlocked:NPAGES-1,solved:{},tries:{},hints:{}}, exRes={}; let exam=false;
  codeFields().forEach(([k,b,id,x])=>{
    const v=Number(n&((1n<<BigInt(b))-1n)); n>>=BigInt(b);
    if(k==='page') NS.page=Math.min(v,NPAGES-1); else if(k==='exam') exam=!!v;
    else if(k==='ex') (exRes[id]=exRes[id]||[])[x]=!!v;
    else if(k==='sol'&&v) NS.solved[id]=true; else if(k==='hin'&&v) NS.hints[id]=v;
  });
  if(exam){ let p=0,max=0; TOPICS.forEach((t,ti)=>{ if(t.exam) t.tasks.forEach((task,j)=>task.parts.forEach((pt,k)=>{max+=pts(pt); if(exRes[ti+'-'+j][k]) p+=pts(pt);})); }); NS.exam={pts:p,max,res:exRes}; }
  S=NS; save(); return true;
}
function showSave(){
  const code=makeCode(), link=location.origin+location.pathname+'#code='+code;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="savecard"><h2 style="margin-top:0">💾 Gespeichert!</h2>
    <p>Schreib dir diesen Code auf (oder mach ein Foto). Auf dem Deckblatt eintippen → du bist wieder genau hier.</p>
    <div class="code">${code}</div>
    <p><button class="pen" data-copy="${code}">Code kopieren</button> <button class="pen" data-copy="${link}">Link kopieren</button> <span class="fb" id="copyMsg"></span></p>
    <p style="font-size:16px;word-break:break-all;color:var(--pencil)">Oder diesen Link öffnen: <a href="${link}">${link}</a></p>
    <p><button class="mini" id="closeSave">✕ schließen</button></p></div>`;
  document.body.appendChild(ov);
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.querySelector('#closeSave').onclick=()=>ov.remove();
  ov.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.copy); ov.querySelector('#copyMsg').innerHTML='<span class="ok">kopiert ✔</span>'; }
    catch(e){ ov.querySelector('#copyMsg').innerHTML='<span class="bad">bitte von Hand abschreiben</span>'; }
  });
}
document.getElementById('saveBtn').onclick=showSave;
(function(){ const m=location.hash.match(/code=([0-9A-Za-z-]+)/); if(m && applyCode(m[1])) history.replaceState(null,'',location.pathname); })();

$page.addEventListener('input',()=>updateSums($page));
$page.addEventListener('change',()=>updateSums($page));
render();
</script>
